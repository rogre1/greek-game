<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>משחק יוונית — אותיות ומילים</title>
<meta name="description" content="משחק לתרגול האלפבית היווני ומילים שימושיות ליום־יום ביוון.">
<meta name="theme-color" content="#0d5eaf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="יוונית">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d5eaf'/><text x='50' y='74' font-size='68' font-family='Georgia,serif' fill='%23ffffff' text-anchor='middle'>%CE%A9</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:  #ffffff;
    --card:   #ffffff;
    --ink:    #0e1b2a;
    --muted:  #6d8298;
    --rule:   #d9e6f2;
    --blue:   #0d5eaf;   /* the blue of the Greek flag */
    --blue-s: #e8f1fb;
    --navy:   #0a3d72;
    --navy-s: #dfeaf7;
    --good:   #1a7a4f;
    --good-s: #e3f4ec;
    --bad:    #b03a3a;
    --bad-s:  #fbeaea;
    --shadow: 0 1px 2px rgba(13,94,175,.06), 0 8px 24px rgba(13,94,175,.10);
  }
  :root[data-theme="dark"] {
      --paper:#0b1420; --card:#121e2d; --ink:#eaf1f8; --muted:#8ea4bb; --rule:#22344a;
      --blue:#63a9f0; --blue-s:#13293f; --navy:#a9c9ea; --navy-s:#182b3f;
      --good:#5ed49f; --good-s:#123227; --bad:#f08a8a; --bad-s:#331e1e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 18px 14px 28px;
  }
  .app { width: 100%; max-width: 520px; display: flex; flex-direction: column; }

  /* isolate מונע מסימני פיסוק יווניים (;) לקפוץ לצד השני בתוך טקסט עברי */
  .gk { font-family: "Times New Roman", Times, serif; unicode-bidi: isolate; }

  /* תמונות פרופיל עגולות */
  .avatar { border-radius: 50%; object-fit: cover; display: inline-block; vertical-align: middle;
            border: 1.5px solid var(--rule); background: var(--rule); }
  .avatar.big { width: 46px; height: 46px; flex: none; }
  .avatar.sm  { width: 24px; height: 24px; border-width: 1px; }
  .avatar.xs  { width: 20px; height: 20px; border-width: 1px; }
  .duocol.me .avatar { border-color: var(--blue); }
  .baravatar { flex: none; display: flex; align-items: center; }
  .baravatar .em { font-size: 17px; }
  .prompt .phrase, .prompt .word, .prompt .glyph, .tgk { direction: ltr; }

  /* ---------- top bar ---------- */
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 30px; }
  .bar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; flex: 1; }
  .bar h1 span { color: var(--muted); font-weight: 500; }
  .chip {
    font-size: 13.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
    background: var(--blue-s); color: var(--blue); white-space: nowrap;
  }
  .chip.streak { background: var(--navy-s); color: var(--navy); }
  .iconbtn {
    border: 1px solid var(--rule); background: var(--card); color: var(--muted);
    border-radius: 9px; width: 30px; height: 30px; font-size: 15.5px; cursor: pointer;
  }
  .iconbtn:hover { color: var(--ink); }

  .track { height: 5px; background: var(--rule); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .fill { height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width .35s ease; }

  /* ---------- cards ---------- */
  .card {
    background: var(--card); border: 1px solid var(--rule); border-radius: 16px;
    padding: 22px 18px; box-shadow: var(--shadow);
  }

  /* ---------- start screen ---------- */
  .hero { text-align: center; padding: 26px 18px 24px; }
  .hero .big { font-size: 49.5px; line-height: 1; letter-spacing: .04em; margin-bottom: 14px; color: var(--blue); }
  .hero h2 { font-size: 23.5px; font-weight: 700; letter-spacing: -.02em; }
  .hero p { font-size: 15px; color: var(--muted); margin-top: 7px; line-height: 1.5; }

  /* כותרת בכתב יד מחובר — פונטים של המערכת, בלי תלות ברשת */
  .apptitle {
    font-family: 'Sacramento', 'Snell Roundhand', 'Brush Script MT', 'Segoe Script', cursive;
    font-size: 52px; font-weight: 400; color: var(--blue);
    line-height: 1.15; direction: ltr; margin-bottom: 16px; padding: 0 4px;
  }

  /* שתי כרטיסיות ריבועיות זו לצד זו */
  .picker { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .pcard {
    display: flex; flex-direction: column; align-items: center; gap: 11px;
    border: 1.5px solid var(--rule); background: var(--card); color: var(--ink);
    border-radius: 16px; padding: 20px 10px 17px; cursor: pointer; font: inherit;
    transition: border-color .15s, transform .1s;
  }
  .pcard:hover { border-color: var(--blue); }
  .pcard:active { transform: scale(.98); }
  .pcard b { font-size: 18px; font-weight: 700; }
  .pcard .avatar { width: 76px; height: 76px; border-width: 2px; }

  /* the nine stripes of the Greek flag */
  .flag {
    width: 76px; height: 18px; margin: 0 auto 16px; border-radius: 3px;
    border: 1px solid var(--rule);
    background: repeating-linear-gradient(to bottom, var(--blue) 0 2px, var(--card) 2px 4px);
  }

  .modes { display: grid; gap: 10px; margin-top: 20px; }
  .mode {
    display: flex; align-items: center; gap: 12px; text-align: right;
    border: 1px solid var(--rule); background: var(--card); color: var(--ink);
    border-radius: 13px; padding: 13px 14px; cursor: pointer; font: inherit;
    transition: border-color .15s, transform .1s;
  }
  .mode:hover { border-color: var(--blue); }
  .mode:active { transform: scale(.99); }
  .mode .em { font-size: 24.5px; width: 28px; text-align: center; }
  .mode b { display: block; font-size: 17px; font-weight: 700; }
  .mode small { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }

  /* level switch */
  .tabs {
    display: flex; gap: 6px; margin-top: 22px; padding: 4px;
    background: var(--rule); border-radius: 12px;
  }
  .tab {
    flex: 1; border: none; background: transparent; color: var(--muted); font: inherit;
    font-size: 15px; font-weight: 700; padding: 8px 6px; border-radius: 9px; cursor: pointer;
  }
  .tab.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* category grid inside level 2 */
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cats .mode { padding: 11px 10px; gap: 8px; }
  .cats .mode .em { font-size: 19px; width: 20px; }
  .cats .mode b { font-size: 15px; }
  .cats .mode small { font-size: 13px; }

  /* ---------- question ---------- */
  .ask { font-size: 14.5px; color: var(--muted); font-weight: 600; letter-spacing: .01em; }
  .prompt { text-align: center; padding: 18px 0 22px; }
  .prompt .glyph { font-size: 69.5px; line-height: 1.05; letter-spacing: .03em; color: var(--blue); }
  .prompt .word  { font-size: 38px; font-weight: 700; line-height: 1.15; color: var(--blue); }
  .prompt .plain { font-size: 29px; font-weight: 700; line-height: 1.25; }
  .prompt .hint  { font-size: 14.5px; color: var(--muted); margin-top: 8px; }
  .say {
    margin-top: 10px; border: 1px solid var(--rule); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 5px 13px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .say:hover { color: var(--blue); border-color: var(--blue); }
  .sayhint { font-size: 13px; color: var(--muted); margin-top: 7px; line-height: 1.35; }

  .opts { display: grid; gap: 9px; }
  .opt {
    display: flex; align-items: center; gap: 11px; text-align: right;
    border: 1.5px solid var(--rule); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 12px 13px; cursor: pointer; font: inherit;
    font-size: 18px; line-height: 1.25; transition: border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--blue); }
  .opt:disabled { cursor: default; }
  .opt .n {
    flex: none; width: 21px; height: 21px; border-radius: 6px; background: var(--rule);
    color: var(--muted); font-size: 12.5px; font-weight: 700; display: grid; place-items: center;
  }
  .opt .txt { flex: 1; }
  .opt.gk .txt { font-family: "Times New Roman", Times, serif; font-size: 23.5px; font-weight: 700; color: var(--blue); }
  .opt.right { border-color: var(--good); background: var(--good-s); }
  .opt.right .n { background: var(--good); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-s); }
  .opt.wrong .n { background: var(--bad); color: #fff; }
  .opt.dim { opacity: .45; }

  .feedback {
    margin-top: 14px; border-radius: 12px; padding: 11px 13px; font-size: 15px; line-height: 1.45;
    display: none;
  }
  .feedback.on { display: block; }
  .feedback.ok { background: var(--good-s); color: var(--good); }
  .feedback.no { background: var(--bad-s); color: var(--bad); }
  .feedback b { font-weight: 700; }
  .feedback .gk { font-size: 19px; }

  /* ---------- end screen ---------- */
  .score { text-align: center; padding: 8px 0 4px; }
  .score .num { font-size: 51.5px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .score .of { font-size: 17px; color: var(--muted); margin-top: 6px; }
  .score .msg { font-size: 16px; margin-top: 12px; line-height: 1.5; }

  .review { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 14px; }
  .review h3 { font-size: 14px; color: var(--muted); font-weight: 700; letter-spacing: .04em; margin-bottom: 9px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 15.5px; }
  .row:last-child { border-bottom: none; }
  .row .k { font-family: "Times New Roman", Times, serif; font-size: 22.5px; font-weight: 700; min-width: 62px; color: var(--blue); }
  .row .v { flex: 1; color: var(--muted); font-size: 14.5px; }
  .row .v b { color: var(--ink); font-weight: 600; }

  .btn {
    display: block; width: 100%; margin-top: 16px; border: none; border-radius: 12px;
    background: var(--blue); color: #fff; font: inherit; font-size: 17.5px; font-weight: 700;
    padding: 13px; cursor: pointer;
  }
  .btn:active { opacity: .9; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--rule); margin-top: 9px; font-weight: 600; }
  .btn.ghost:hover { color: var(--ink); }

  /* ---------- reference table ---------- */
  /* the reference rows are Greek/English content — read them left-to-right */
  /* minmax(0,…) + min-width:0 keep long phrases like "Δεν καταλαβαίνω" from widening the page */
  .tbl { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 14px; direction: ltr; text-align: left; }
  .tbl .e { display: flex; gap: 9px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
  .tbl .e .d { min-width: 0; overflow-wrap: anywhere; }
  .tbl .e .g { font-family: "Times New Roman", Times, serif; font-size: 19px; font-weight: 700; min-width: 34px; color: var(--blue); }
  .tbl .e .d { font-size: 14px; line-height: 1.35; }
  .tbl .e .d b { display: block; font-family: "Times New Roman", Times, serif; font-size: 17px; }
  .tbl .e .d i { font-style: normal; color: var(--blue); }
  /* the Hebrew gloss gets its own line and its own direction, so "!הצילו" keeps its punctuation */
  .tbl .e .d s {
    display: block; text-decoration: none; color: var(--muted);
    direction: rtl; unicode-bidi: isolate; text-align: left; margin-top: 1px;
  }
  @media (max-width: 520px) { .tbl { grid-template-columns: 1fr; } }

  /* ---------- שני הפרופילים במסך הראשי ---------- */
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; margin-bottom: 12px; }
  .duocol {
    border: 1.5px solid var(--rule); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 11px 10px; text-align: right; cursor: pointer; font: inherit;
  }
  .duocol.me { border-color: var(--blue); background: var(--blue-s); }
  .duocol:hover { border-color: var(--blue); }
  .duoname { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .duostage { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.3; min-height: 32px; }
  .duobar { height: 5px; background: var(--rule); border-radius: 99px; overflow: hidden; margin: 7px 0 6px; }
  .duobar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
  .duometa { font-size: 12px; color: var(--blue); font-weight: 600; }
  .duocol.idle .duometa { color: var(--muted); font-weight: 400; }

  /* ---------- מסך המסלול ---------- */
  .pathhead { padding: 18px 16px 16px; }
  .chapnav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .chapmid { flex: 1; text-align: center; }
  .chaptitle { font-size: 17.5px; font-weight: 700; letter-spacing: -.01em; }
  .chapcount { font-size: 14px; color: var(--muted); margin-top: 3px; }
  .chapbtn {
    flex: none; width: 32px; height: 32px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--rule); background: var(--card); color: var(--blue);
    font-size: 21.5px; line-height: 1; font-family: inherit;
  }
  .chapbtn.off { opacity: .3; pointer-events: none; }
  .chaptrack { height: 5px; background: var(--rule); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .chapfill { height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width .35s ease; }

  .mode.station { gap: 11px; }
  .stmark {
    flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 14.5px; font-weight: 700; background: var(--rule); color: var(--muted);
  }
  .stmark.done { background: var(--blue); color: #fff; }
  .stmark.open { background: var(--blue-s); color: var(--blue); font-size: 11px; }
  .stbody { flex: 1; min-width: 0; }
  .stmeta { flex: none; font-size: 13.5px; font-weight: 700; color: var(--blue); }
  .station.locked, .station.soon { opacity: .5; }
  .station.locked:hover, .station.soon:hover { border-color: var(--rule); }

  .tools { margin-top: 12px; padding: 12px 14px; display: grid; gap: 8px; }
  .tools .mode { border: none; padding: 10px 4px; }
  .tools .mode:hover b { color: var(--blue); }

  .pathfoot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 0 4px; }
  .chip.prof { border: none; font-family: inherit; cursor: pointer; font-size: 14px; }
  .linkbtn {
    border: none; background: none; color: var(--muted); font: inherit; font-size: 14.5px;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .linkbtn:hover { color: var(--blue); }

  /* ---------- שאלות חדשות ---------- */
  .prompt .phrase { font-size: 28px; font-weight: 700; line-height: 1.3; color: var(--blue); }
  .prompt .muted-listen { color: var(--rule); letter-spacing: .15em; }
  .say.big { font-size: 17px; padding: 10px 20px; border-color: var(--blue); color: var(--blue); font-weight: 600; }
  .opt.gk.sm .txt { font-size: 19px; line-height: 1.35; }

  .unlock {
    margin-top: 14px; border-radius: 12px; padding: 10px 13px; font-size: 15px;
    background: var(--blue-s); color: var(--blue);
  }
  .btn.small { font-size: 15px; padding: 9px; margin-top: 10px; }

  /* ---------- מצב שיחה ---------- */
  .micwrap { text-align: center; padding: 20px 0 8px; }
  .mic {
    width: 84px; height: 84px; border-radius: 50%; font-size: 38px; cursor: pointer;
    border: 2px solid var(--blue); background: var(--blue-s); color: var(--blue);
    transition: transform .12s, background .2s;
  }
  .mic:active { transform: scale(.96); }
  .mic.rec { background: var(--blue); color: #fff; animation: pulse 1.4s infinite; }
  .mic.off { opacity: .4; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(13,94,175,.35); } 50% { box-shadow: 0 0 0 14px rgba(13,94,175,0); } }
  .miclabel { font-size: 15px; color: var(--muted); margin-top: 12px; line-height: 1.4; }
  .miclive { font-size: 19px; color: var(--blue); margin-top: 8px; min-height: 22px; font-family: "Times New Roman", Times, serif; }
  .talkstatus { font-size: 14px; color: var(--muted); margin-top: 6px; min-height: 16px; }
  .talkstatus.warn { color: var(--bad); }
  .michint { font-size: 13.5px; color: var(--muted); margin-top: 4px; }

  .talkinput { display: flex; gap: 8px; margin: 14px 0 4px; }
  .talkinput input {
    flex: 1; min-width: 0; border: 1px solid var(--rule); border-radius: 11px;
    padding: 11px 12px; font: inherit; font-size: 17px; background: var(--card); color: var(--ink);
  }
  .talkinput input:focus { outline: none; border-color: var(--blue); }
  .tbtn {
    border: 1px solid var(--rule); background: var(--card); color: var(--muted);
    border-radius: 10px; padding: 8px 13px; font: inherit; font-size: 14.5px; cursor: pointer;
  }
  .tbtn:hover { color: var(--blue); border-color: var(--blue); }
  .tbtn.done { color: var(--good); border-color: var(--good); }

  .tcard { border: 1px solid var(--rule); border-radius: 13px; padding: 14px; margin-top: 10px; }
  .tgk { font-size: 27px; font-weight: 700; color: var(--blue); line-height: 1.3; }
  .tpron { font-size: 15.5px; color: var(--blue); opacity: .85; margin-top: 4px; direction: ltr; text-align: right; }
  .the { font-size: 17px; font-weight: 600; color: var(--navy); margin-top: 6px; }
  .tmiss { font-size: 14.5px; color: var(--muted); margin-top: 4px; }
  .trow { display: flex; gap: 8px; margin-top: 11px; }

  .suggest { border: 1px solid var(--blue); background: var(--blue-s); border-radius: 13px; padding: 14px; margin-top: 14px; }
  .sugtitle { font-size: 15px; font-weight: 600; color: var(--blue); margin-bottom: 10px; line-height: 1.4; }
  .sug { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 15px; cursor: pointer; }
  .sug input { width: 16px; height: 16px; accent-color: var(--blue); }
  .sugrow { display: flex; gap: 8px; margin-top: 8px; }
  .sugrow .btn { margin-top: 4px; }

  /* ---------- המילים שלי ---------- */
  .vrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .vrow:last-child { border-bottom: none; }
  .vsay, .vdel {
    flex: none; width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--rule); background: var(--card); color: var(--muted); font-size: 14.5px;
  }
  .vsay:hover { color: var(--blue); }
  .vdel:hover { color: var(--bad); }
  .vtext { flex: 1; min-width: 0; }
  .vtext b { display: block; font-size: 21.5px; color: var(--blue); line-height: 1.2; }
  .vtext i { display: block; font-style: normal; font-size: 14px; color: var(--blue); opacity: .8; direction: ltr; text-align: right; }
  .vtext s { display: block; text-decoration: none; font-size: 14.5px; color: var(--muted); margin-top: 1px; cursor: text; }
  .vtext s:hover { color: var(--blue); }
  .vedit {
    width: 100%; border: 1px solid var(--blue); border-radius: 8px; padding: 5px 8px;
    font: inherit; font-size: 14.5px; background: var(--card); color: var(--ink);
  }
  .vedit:focus { outline: none; }
  .empty { font-size: 15px; color: var(--muted); line-height: 1.6; text-align: center; padding: 26px 10px; }

  /* ---------- השוואה ---------- */
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pcol { border: 1px solid var(--rule); border-radius: 13px; padding: 13px 10px; text-align: center; }
  .pcol.me { border-color: var(--blue); background: var(--blue-s); }
  .phead { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .pstat { padding: 5px 0; }
  .pstat b { display: block; font-size: 23.5px; font-weight: 700; color: var(--blue); line-height: 1.1; }
  .pstat span { font-size: 13px; color: var(--muted); }
  .note2 { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin-top: 14px; }
  .syncbox { border: 1px solid var(--rule); border-radius: 13px; padding: 13px; margin-top: 16px; }
  .syncttl { font-size: 14.5px; font-weight: 700; }

   הגרסה האחרונה: מושכים את הדף מהשרת בלי מטמון, ואם מספר הגרסה שם שונה — טוענים אותה.

(function checkForUpdate(){
  if (location.protocol === 'file:') return;
  fetch(location.pathname + '?bust=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.text() : null)
    .then(txt => {
      if (!txt) return;
      const m = txt.match(/APP_VERSION\s*=\s*'([^']+)'/);
      if (m && m[1] !== APP_VERSION) location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    })
    .catch(() => {});
})();

let roundLen = 12;
let WPOOL = WORDS;            // which word list the word questions draw from
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[(Math.random()*a.length)|0];

/* distractors: n other items, unique by the field we show */
function others(pool, item, field, n) {
  const seen = new Set([item[field]]);
  const out = [];
  for (const o of shuffle(pool)) {
    if (out.length === n) break;
    if (seen.has(o[field])) continue;
    seen.add(o[field]); out.push(o);
  }
  return out;
}

/* ---------- question builders ---------- */
const BUILD = {
  // which letter is this?
  letterName(){ const it = pick(LETTERS);
    return { ask:'איזו אות זו?', prompt:{type:'glyph', text: it.u+' '+it.l}, speak: it.u, pron: it.say,
      correct: it.name, options: [it, ...others(LETTERS,it,'name',3)].map(o=>o.name),
      note:`<b class="gk">${it.u} ${it.l}</b> — ${it.name} · ${it.say}`, tag:`${it.u} ${it.l}`, tagNote:`${it.name} — ${it.sound}` }; },

  // what sound does it make?
  letterSound(){ const it = pick(LETTERS);
    return { ask:'איזה צליל האות הזאת עושה?', prompt:{type:'glyph', text: it.u+' '+it.l}, speak: it.u, pron: it.say,
      correct: it.sound, options: [it, ...others(LETTERS,it,'sound',3)].map(o=>o.sound),
      note:`<b class="gk">${it.u} ${it.l}</b> (${it.name}) נשמעת כמו <b>${it.sound}</b>`, tag:`${it.u} ${it.l}`, tagNote:`${it.name} — ${it.sound}` }; },

  // which letter makes this sound?
  // distractors must differ by SOUND, not by name — Η, Ι, Υ all say "ee in see",
  // so picking by name could put two correct answers on screen.
  soundLetter(){ const it = pick(LETTERS);
    const twins = LETTERS.filter(o => o.sound === it.sound && o.u !== it.u).map(o => o.u+' '+o.l);
    return { ask:'איזו אות עושה את הצליל הזה?', prompt:{type:'plain', text: it.sound, hint:'האות שנשמעת ככה'},
      correct: it.u+' '+it.l, options: [it, ...others(LETTERS,it,'sound',3)].map(o=>o.u+' '+o.l), greekOpts:true,
      note:`<b>${it.sound}</b> = <b class="gk">${it.u} ${it.l}</b> (${it.name})` +
           (twins.length ? ` · אותו צליל גם ב־<b class="gk">${twins.join(' ')}</b>` : ''),
      tag:`${it.u} ${it.l}`, tagNote:`${it.name} — ${it.sound}` }; },

  // greek word -> meaning
  wordMean(){ const it = pick(WPOOL);
    return { ask:'מה המילה הזאת אומרת?', prompt:{type:'word', text: it.gk, hint: it.pron}, speak: it.gk, pron: it.pron,
      correct: it.he, options: [it, ...others(WPOOL,it,'he',3)].map(o=>o.he),
      note:`<b class="gk">${it.gk}</b> = ${it.he} · ${it.pron}`, tag:it.gk, tagNote:`${it.he} — ${it.pron}` }; },

  // meaning -> greek word
  meanWord(){ const it = pick(WPOOL);
    return { ask:'איך אומרים את זה ביוונית?', prompt:{type:'plain', text: it.he},
      correct: it.gk, options: [it, ...others(WPOOL,it,'gk',3)].map(o=>o.gk), greekOpts:true, speak: it.gk, pron: it.pron,
      note:`${it.he} = <b class="gk">${it.gk}</b> · ${it.pron}`, tag:it.gk, tagNote:`${it.he} — ${it.pron}` }; },

  // greek word -> how to say it
  wordPron(){ const it = pick(WPOOL);
    return { ask:'איך הוגים את המילה?', prompt:{type:'word', text: it.gk, hint: it.he}, speak: it.gk, pron: it.pron,
      correct: it.pron, options: [it, ...others(WPOOL,it,'pron',3)].map(o=>o.pron),
      note:`<b class="gk">${it.gk}</b> נהגית <b>${it.pron}</b> (${it.he})`, tag:it.gk, tagNote:`${it.he} — ${it.pron}` }; },

  /* ----- תחנה 3: לקרוא — מהתעתיק אל הכתיב היווני ----- */
  pronWord(){ const it = pick(WPOOL);
    return { ask:'איזו מילה נכתבת ככה?', prompt:{type:'plain', text: it.pron, hint: it.he},
      correct: it.gk, options: [it, ...others(WPOOL,it,'gk',3)].map(o=>o.gk), greekOpts:true, speak: it.gk, pron: it.pron,
      note:`<b>${it.pron}</b> נכתב <b class="gk">${it.gk}</b> (${it.he})`, tag:it.gk, tagNote:`${it.he} — ${it.pron}` }; },

  /* ----- תחנה 5: משפטים ----- */
  phraseMean(){ const it = pick(WPOOL);
    return { ask:'מה המשפט הזה אומר?', prompt:{type:'phrase', text: it.gk, hint: it.pron}, speak: it.gk, pron: it.pron,
      correct: it.he, options: [it, ...others(WPOOL,it,'he',3)].map(o=>o.he),
      note:`<b class="gk">${it.gk}</b> · ${it.pron}`, tag:it.gk, tagNote:`${it.he} — ${it.pron}` }; },

  meanPhrase(){ const it = pick(WPOOL);
    return { ask:'איך אומרים את זה ביוונית?', prompt:{type:'plain', text: it.he},
      correct: it.gk, options: [it, ...others(WPOOL,it,'gk',3)].map(o=>o.gk), greekOpts:true, longOpts:true,
      speak: it.gk, pron: it.pron,
      note:`${it.he} = <b class="gk">${it.gk}</b> · ${it.pron}`, tag:it.gk, tagNote:`${it.he} — ${it.pron}` }; },

  /* ----- תחנה 6: להבין מה אמרו — המשפט מושמע ומוסתר עד שעונים ----- */
  listenPhrase(){ const it = pick(WPOOL);
    return { ask:'מה נאמר?', prompt:{type:'listen', text: it.gk, hint: it.pron}, speak: it.gk, pron: it.pron,
      correct: it.he, options: [it, ...others(WPOOL,it,'he',3)].map(o=>o.he),
      note:`<b class="gk">${it.gk}</b> · ${it.pron}`, tag:it.gk, tagNote:`${it.he} — ${it.pron}` }; },

  /* ----- תחנה 7: לענות ----- */
  replyPick(){ const it = pick(WPOOL);
    return { ask:'אומרים לך את זה — מה עונים?', prompt:{type:'phrase', text: it.ask, hint: it.askHe}, speak: it.ask,
      correct: it.gk, options: [it, ...others(WPOOL,it,'gk',3)].map(o=>o.gk), greekOpts:true, longOpts:true,
      note:`${it.ask} ← <b class="gk">${it.gk}</b> · ${it.pron} (${it.he})`, tag:it.gk, tagNote:`${it.he} — ${it.pron}` }; }
};

/* תמונת פרופיל בעיגול — ואם עוד אין תמונה, האימוג'י ממשיך לשמש */
function avatar(p, cls){
  return p.photo
    ? `<img class="avatar ${cls || ''}" src="${p.photo}" alt="${p.name}">`
    : `<span class="em ${cls || ''}">${p.em}</span>`;
}
const SKEY = id => 'greek:v2:' + id;
const blankState = () => ({ stations:{}, vocab:[], stats:{correct:0, wrong:0, bestStreak:0, rounds:0} });

let profile = null, S = blankState();

function loadState(id){
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(SKEY(id)) || '{}'); } catch(e){}
  S = Object.assign(blankState(), raw);
  S.stations = S.stations || {};
  S.vocab = S.vocab || [];
  S.stats = Object.assign(blankState().stats, S.stats || {});
}
function saveState(){
  if (!profile) return;
  S.rev = (S.rev || 0) + 1;
  S.updated = Date.now();
  try { localStorage.setItem(SKEY(profile.id), JSON.stringify(S)); } catch(e){}
  schedulePush();
}

/* ---------- סנכרון בין הטלפונים ----------
   הכתובת נשמרת במכשיר ולא בקוד, כך שהיא לא מתפרסמת ב-repo הציבורי.
   כל מכשיר דוחף את המצב שלו ומושך את של השני; הגרסה (rev) קובעת מי מנצח. */
const SYNC_URL = 'https://greek-sync.ronigreen.workers.dev';                 // נכתב אוטומטית על ידי greek-sync/deploy.sh
const SYNC_KEY = 'greek:sync-url';
const syncUrl = () => {
  let saved = '';
  try { saved = localStorage.getItem(SYNC_KEY) || ''; } catch(e){}
  return (saved || SYNC_URL).replace(/\/+$/, '');
};
let syncState = 'off', lastSync = 0, pushTimer = null, pulling = null;

function setSyncStatus(s){ syncState = s; if ($('syncStatus')) renderSyncBox(); }

function schedulePush(){
  if (!syncUrl() || !profile) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushState, 1500);       // לא דוחפים על כל תשובה, רק כשנרגע
}

async function pushState(){
  const u = syncUrl();
  if (!u || !profile) return;
  try {
    const r = await fetch(u + '/state/' + profile.id, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(S)
    });
    if (r.status === 409) {                       // המכשיר השני מעודכן יותר — מאמצים אותו
      const j = await r.json();
      if (j && j.state) { S = Object.assign(blankState(), j.state);
        try { localStorage.setItem(SKEY(profile.id), JSON.stringify(S)); } catch(e){} }
      setSyncStatus('ok'); lastSync = Date.now(); return;
    }
    if (r.ok) {
      // השרת ממזג ומחזיר את התוצאה — מאמצים אותה כדי ששני המכשירים יהיו זהים
      try {
        const j = await r.json();
        if (j && j.state) {
          S = Object.assign(blankState(), j.state);
          try { localStorage.setItem(SKEY(profile.id), JSON.stringify(S)); } catch(e){}
        }
      } catch(e){}
      lastSync = Date.now();
    }
    setSyncStatus(r.ok ? 'ok' : 'err');
  } catch(e){ setSyncStatus('err'); }
}

async function pullProfile(id){
  const u = syncUrl();
  if (!u) return null;
  try {
    const r = await fetch(u + '/state/' + id + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    return await r.json();
  } catch(e){ return null; }
}

/* מושך את שני הפרופילים: את שלי מאמץ רק אם הגרסה בענן חדשה יותר.
   אם משיכה כבר רצה — מחזירים את אותה הבטחה במקום לוותר בשקט. */
function syncPull(){
  if (!syncUrl() || !profile) return Promise.resolve();
  if (pulling) return pulling;
  pulling = doPull().finally(() => { pulling = null; });
  return pulling;
}

async function doPull(){
  const u = syncUrl();
  try {
    for (const p of PROFILES) {
      const remote = await pullProfile(p.id);
      if (!remote) continue;
      if (p.id === profile.id) {
        if ((remote.rev || 0) > (S.rev || 0)) {
          S = Object.assign(blankState(), remote);
          try { localStorage.setItem(SKEY(p.id), JSON.stringify(S)); } catch(e){}
        }
      } else {
        const local = peekState(p.id);
        if ((remote.rev || 0) >= (local.rev || 0)) {
          try { localStorage.setItem(SKEY(p.id), JSON.stringify(remote)); } catch(e){}
        }
      }
    }
    setSyncStatus('ok'); lastSync = Date.now();
  } catch(e){ setSyncStatus('err'); }
}
function setProfile(id){
  profile = PROFILES.find(p => p.id === id) || PROFILES[0];
  loadState(profile.id);
  try { localStorage.setItem('greek:v2:last', profile.id); } catch(e){}
}
function peekState(id){          // לקרוא פרופיל אחר בלי להחליף אליו — למסך ההשוואה
  try { return Object.assign(blankState(), JSON.parse(localStorage.getItem(SKEY(id)) || '{}')); }
  catch(e){ return blankState(); }
}

/* תחנה נחשבת הושלמה מ-75% ומעלה, והיא זו שפותחת את הבאה */
const stBest = id => (S.stations[id] && S.stations[id].best) || 0;
const stDone = id => stBest(id) >= 0.75;
function stStatus(st){
  if (st.soon) return 'soon';
  if (stDone(st.id)) return 'done';
  const prev = STATIONS.find(s => s.id === st.id - 1);
  return (!prev || stDone(prev.id)) ? 'open' : 'locked';
}

/* ווקבולרי אישי */
function addVocab(it){
  if (!it || !it.gk || !it.he) return false;          // בלי תרגום אין מה לתרגל
  if (S.vocab.some(v => v.gk === it.gk)) return false;
  S.vocab.unshift({ gk: it.gk, he: it.he, pron: it.pron || translit(it.gk), at: Date.now(), src: it.src || 'save' });
  saveState();
  return true;
}

/* המילים שנאספו מהשיחות מצטרפות למאגר של התחנות — מילים בודדות לתחנה 4, ביטויים לתחנה 5 */
function vocabFor(poolName){
  const isPhrase = s => /\s/.test(s);
  return S.vocab
    .filter(v => v.he && (poolName === 'PHRASES' ? isPhrase(v.gk) : !isPhrase(v.gk)))
    .map(v => ({ gk: v.gk, he: v.he, pron: v.pron }));
}
function poolFor(st){
  const pools = { WORDS, WORDS2, PHRASES, REPLIES };
  if (!st.pool) return null;
  const base = pools[st.pool];
  if (st.pool !== 'WORDS2' && st.pool !== 'PHRASES') return base;
  const extra = vocabFor(st.pool).filter(v => !base.some(b => b.gk === v.gk));
  return extra.length ? base.concat(extra) : base;
}
function removeVocab(gk){
  S.vocab = S.vocab.filter(v => v.gk !== gk);
  saveState();
}

/* ---------- state של הסיבוב הנוכחי ---------- */
let qs=[], idx=0, score=0, streak=0, best=0, misses=[], locked=false, timer=null;
let round = null;   // {kinds, pool, label, stationId}

function makeRound(kinds){
  const out = [];
  // מאגר קטן לא יכול למלא 12 שאלות שונות — מקצרים את הסיבוב במקום לחזור על שאלות
  const fromPool = kinds.every(k => !LETTER_KINDS.includes(k));
  const ceiling = fromPool ? WPOOL.length * kinds.length : 99;
  roundLen = Math.min(12, ceiling);
  let guard = 0;
  while (out.length < roundLen && guard++ < 3000) {
    const q = BUILD[kinds[out.length % kinds.length]]();
    // אף שאלה לא חוזרת פעמיים באותו סיבוב
    if (out.some(p => p.tag === q.tag && p.ask === q.ask)) continue;
    q.options = shuffle(q.options);
    out.push(q);
  }
  roundLen = out.length;
  return shuffle(out);
}

/* ---------- speech ----------
   Chrome only allows speech that follows a real click, and a blocked call leaves the
   queue stuck (speaking === true forever) which kills every later call too.
   So: speak ONLY from the 🔊 button, never automatically. */
const canSpeak = 'speechSynthesis' in window;
let elVoice = null, primed = false;
function findVoice(){
  if (!canSpeak) return;
  const v = speechSynthesis.getVoices().find(v => /^el/i.test(v.lang));
  if (v) elVoice = v;
}
if (canSpeak) { findVoice(); speechSynthesis.onvoiceschanged = findVoice; }

function sayHint(msg){ const h = $('sayHint'); if (h) { h.textContent = msg; h.classList.remove('hide'); } }

/* text: the Greek word · fallback: the phonetic spelling, for devices with no Greek voice */
function speak(text, fallback){
  if (!canSpeak) return;
  const s = speechSynthesis;
  try {
    if (!primed) { primed = true; s.speak(new SpeechSynthesisUtterance('')); } // unlock on first click
    s.cancel();                                   // clear anything stuck in the queue
    findVoice();
    const greek = !!elVoice;
    const u = new SpeechSynthesisUtterance(greek ? text : (fallback || text).replace(/-/g, ' '));
    if (greek) { u.voice = elVoice; u.lang = elVoice.lang; }
    u.rate = 0.8;
    let started = false;
    u.onstart = () => { started = true; };
    u.onerror = () => sayHint('הדפדפן חוסם הקראה — נסי בספארי');
    s.speak(u);
    // if it never actually starts, say so instead of failing silently
    setTimeout(() => { if (!started && !s.speaking) s.cancel(); }, 400);
    setTimeout(() => { if (!started) sayHint(elVoice
      ? 'לא הצלחתי להשמיע — נסי בספארי'
      : 'אין קול יווני במחשב · הגדרות ▸ נגישות ▸ תוכן מדובר'); }, 1600);
  } catch(e){ sayHint('הדפדפן חוסם הקראה'); }
}

/* ---------- screens ---------- */
/* ---------- תעתיק הגייה: עובד על כל טקסט יווני, בלי שום שירות חיצוני ----------
   הכתיב היווני עקבי, אז אפשר להמיר אותו בחוקים: קודם צמדי אותיות (μπ, ου, ευ...),
   אחר כך אותיות בודדות לפי מה שבא אחריהן, ולבסוף הדגשת ההברה שנושאת את סימן ההטעמה. */
const UNACCENT = {'ά':'α','έ':'ε','ή':'η','ί':'ι','ό':'ο','ύ':'υ','ώ':'ω','ϊ':'ι','ϋ':'υ','ΐ':'ι','ΰ':'υ'};
const FRONT = 'εέηήιίϊΐειοι';                    // תנועות שהופכות γ ל-y ו-χ ל-h
const VOICELESS = 'θκξπστφχψ';                   // אחריהן αυ/ευ נשמעות af/ef
const VOICED_AFTER_S = 'βγδμνρλ';                // σ לפני אלה נשמעת z
const VOWELS = 'αεηιουω';

function translit(text){
  return String(text).split(/(\s+)/).map(tok =>
    /^\s+$/.test(tok) ? tok : translitWord(tok)).join('');
}

function translitWord(word){
  const punct = word.match(/[.,!;·?]+$/);
  let w = word.replace(/[.,!;·?]+$/, '');
  if (!/[α-ωΑ-Ω]/i.test(w)) return word;

  // עיצור כפול נהגה ביוונית כמו עיצור אחד (θάλασσα = THA-la-sa). γγ יוצא מן הכלל — הוא צמד בפני עצמו.
  const src = w.toLowerCase().replace(/ς/g, 'σ').replace(/([λμνπρστφκβδζθξψ])\1/g, '$1');
  let stressAt = -1;                     // אינדקס התנועה המוטעמת ברשימת היחידות
  const units = [];                      // {t: latin, v: isVowel}
  const push = (t, v) => units.push({t, v});
  const isVowelAt = j => { const ch = src[j]; return ch && VOWELS.includes(UNACCENT[ch] || ch); };

  for (let i = 0; i < src.length; i++) {
    const c = src[i], n = src[i + 1] || '', base = UNACCENT[c] || c;
    const accented = !!UNACCENT[c];
    const nBase = UNACCENT[n] || n;
    const after = UNACCENT[src[i + 2]] || src[i + 2] || '';
    const two = base + nBase;
    const stressed = accented || !!UNACCENT[n];

    // צמדי תנועות
    if (two === 'ου') { if (stressed) stressAt = units.length; push('u', 1); i++; continue; }
    if (two === 'αι') { if (stressed) stressAt = units.length; push('e', 1); i++; continue; }
    if (two === 'ει' || two === 'οι' || two === 'υι') {
      // ει לא מוטעמת לפני תנועה נשמעת כמו y (παλιά, μπάνιο)
      if (!stressed && isVowelAt(i + 2)) { push('y', 0); i++; continue; }
      if (stressed) stressAt = units.length;
      push('ee', 1); i++; continue;
    }
    if (two === 'αυ' || two === 'ευ') {
      if (stressed) stressAt = units.length;
      const f = VOICELESS.includes(after) || after === '';
      push((two === 'αυ' ? 'a' : 'e') + (f ? 'f' : 'v'), 1); i++; continue;
    }
    // צמדי עיצורים
    if (two === 'μπ') { push('b', 0); i++; continue; }
    if (two === 'ντ') { push('d', 0); i++; continue; }
    if (two === 'γκ' || two === 'γγ') { push('g', 0); i++; continue; }
    if (two === 'τσ') { push('ts', 0); i++; continue; }
    if (two === 'τζ') { push('dz', 0); i++; continue; }

    // אותיות בודדות
    if (VOWELS.includes(base)) {
      // ι/η/υ לא מוטעמות לפני תנועה נבלעות ל-y (μπάνιο = BA-nyo, ίσια = EE-sya)
      if ('ιηυ'.includes(base) && !accented && isVowelAt(i + 1) && units.length) { push('y', 0); continue; }
      if (accented) stressAt = units.length;
      push({α:'a', ε:'e', η:'ee', ι:'ee', ο:'o', υ:'ee', ω:'o'}[base], 1);
      continue;
    }
    const front = FRONT.includes(n);
    const map = {
      β:'v', γ: front ? 'y' : 'gh', δ:'th', ζ:'z', θ:'th', κ:'k', λ:'l', μ:'m', ν:'n',
      ξ:'ks', π:'p', ρ:'r', σ: (nBase && VOICED_AFTER_S.includes(nBase)) ? 'z' : 's',
      τ:'t', φ:'f', χ: front ? 'h' : 'kh', ψ:'ps'
    };
    push(map[base] !== undefined ? map[base] : base, 0);
  }

  // חלוקה להברות: עיצור בודד הולך עם התנועה שאחריו; באשכול של שניים
  // הראשון סוגר את ההברה הקודמת — אלא אם האשכול יכול לפתוח מילה ביוונית.
  // γ+ει לפני תנועה מייצרים שני y רצופים (γεια) — מאחדים, ומזיזים בהתאם את סימון ההטעמה
  for (let i = units.length - 1; i > 0; i--)
    if (!units[i].v && units[i].t === units[i - 1].t) {
      units.splice(i, 1);
      if (stressAt > i) stressAt--;
    }

  const OPENERS = ['st','sp','sk','sf','sh','tr','pr','kr','vr','thr','hr','ghr','dr','fr',
                   'pl','kl','vl','ghl','thl','fl','ps','ks','br','bl','gr','gl','dz','ts'];
  const syl = [];
  let buf = [];
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (u.v) {
      const cons = [];
      while (buf.length) cons.unshift(buf.pop());
      // מאשכול עיצורים נשארים עם התנועה רק אלה שיכולים לפתוח מילה; השאר סוגרים את ההברה הקודמת
      if (cons.length > 1 && syl.length) {
        const keep = OPENERS.includes(cons.slice(-2).map(c => c.t).join('')) ? 2 : 1;
        while (cons.length > keep) syl[syl.length - 1].t += cons.shift().t;
      }
      syl.push({ t: cons.map(c => c.t).join('') + u.t, stress: i === stressAt });
    } else {
      buf.push(u);
    }
  }
  if (buf.length) {                      // עיצורים בסוף המילה
    const tail = buf.map(c => c.t).join('');
    if (syl.length) syl[syl.length - 1].t += tail; else syl.push({ t: tail, stress: false });
  }
  if (!syl.length) return word;
  // מילה בלי סימן הטעמה (τον, μας, δεν) היא מילית — לא מדגישים אותה

  const out = syl.map(s => s.stress ? s.t.toUpperCase() : s.t).join('-');
  return out + (punct ? punct[0] : '');
}

/* ---------- מסכים ---------- */
const SCREENS = ['screenProfile','screenPath','screenQuiz','screenEnd','screenStudy',
                 'screenTalk','screenVocab','screenStats'];
function show(which){
  SCREENS.forEach(s => $(s).classList.toggle('hide', s !== which));
  const playing = which === 'screenQuiz';
  $('track').classList.toggle('hide', !playing);
  $('chipScore').classList.toggle('hide', !playing);
  $('chipStreak').classList.toggle('hide', !playing || streak < 2);
  $('btnQuit').classList.toggle('hide', which === 'screenPath' || which === 'screenProfile');
  if (which === 'screenPath') $('modeLabel').textContent = '';
  // במסך הבחירה עוד לא ידוע מי משחק — אין תמונה בסרגל
  if (which === 'screenProfile') $('barAvatar').innerHTML = '';
}

/* cfg: {kinds, pool, label, stationId} */
function startRound(cfg){
  round = cfg;
  WPOOL = cfg.pool || WORDS;
  qs = makeRound(cfg.kinds); idx = 0; score = 0; streak = 0; best = 0; misses = [];
  $('modeLabel').textContent = cfg.label ? '· ' + cfg.label : '';
  show('screenQuiz'); render();
}

function startStation(st){
  startRound({ kinds: st.kinds, pool: poolFor(st), label: st.name, stationId: st.id });
}

function render(){
  const q = qs[idx];
  locked = false;
  clearTimeout(timer);
  $('chipScore').textContent = score + '/' + roundLen;
  $('chipStreak').textContent = '🔥 ' + streak;
  $('chipStreak').classList.toggle('hide', streak < 2);
  $('fill').style.width = (idx / roundLen * 100) + '%';
  $('ask').textContent = q.ask;

  const p = q.prompt;
  let html = '';
  if (p.type === 'glyph')  html = `<div class="glyph gk">${p.text}</div>`;
  if (p.type === 'word')   html = `<div class="word gk">${p.text}</div>`;
  if (p.type === 'plain')  html = `<div class="plain">${p.text}</div>`;
  if (p.type === 'phrase') html = `<div class="phrase gk">${p.text}</div>`;
  // בתחנת ההאזנה המשפט מוסתר עד שעונים — ואם אין הקראה במכשיר, הוא פשוט מוצג
  if (p.type === 'listen') html = canSpeak
    ? `<div class="phrase gk muted-listen" id="listenText">···</div>`
    : `<div class="phrase gk">${p.text}</div>`;
  if (p.hint) html += `<div class="hint" id="hint"></div>`;
  if (q.speak && canSpeak) html += `<button class="say${p.type === 'listen' ? ' big' : ''}" id="btnSay">🔊 ${p.type === 'listen' ? 'להשמיע שוב' : 'להשמיע'}</button><div class="sayhint hide" id="sayHint"></div>`;
  $('prompt').innerHTML = html;
  if (q.speak && canSpeak) $('btnSay').onclick = () => speak(q.speak, q.pron);

  $('feedback').className = 'feedback';
  $('feedback').innerHTML = '';
  $('btnNext').classList.add('hide');
  $('btnNext').textContent = (idx === roundLen - 1) ? 'לסיכום' : 'המשך';

  $('opts').innerHTML = q.options.map((o,i) =>
    `<button class="opt${q.greekOpts ? ' gk' : ''}${q.longOpts ? ' sm' : ''}" data-i="${i}"><span class="n">${i+1}</span><span class="txt">${o}</span></button>`
  ).join('');
  [...$('opts').children].forEach(b => b.onclick = () => answer(+b.dataset.i));
}

function answer(i){
  if (locked) return;
  locked = true;
  const q = qs[idx];
  const chosen = q.options[i];
  const ok = chosen === q.correct;

  if (ok) { score++; streak++; best = Math.max(best, streak); }
  else { streak = 0; if (!misses.some(m => m.tag === q.tag)) misses.push({tag:q.tag, note:q.tagNote}); }

  [...$('opts').children].forEach(b => {
    const t = q.options[+b.dataset.i];
    b.disabled = true;
    if (t === q.correct) b.classList.add('right');
    else if (+b.dataset.i === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  // reveal the hint (pronunciation / meaning) only after answering
  if (q.prompt.hint && $('hint')) $('hint').textContent = q.prompt.hint;
  // in the listening station the sentence itself is revealed too
  if ($('listenText')) { $('listenText').textContent = q.prompt.text; $('listenText').classList.remove('muted-listen'); }

  S.stats[ok ? 'correct' : 'wrong']++;
  if (streak > S.stats.bestStreak) S.stats.bestStreak = streak;

  const fb = $('feedback');
  fb.className = 'feedback on ' + (ok ? 'ok' : 'no');
  fb.innerHTML = (ok ? '✓ ' : '✗ ') + q.note;

  $('chipScore').textContent = score + '/' + roundLen;
  $('chipStreak').textContent = '🔥 ' + streak;
  $('chipStreak').classList.toggle('hide', streak < 2);

  $('btnNext').classList.remove('hide');
  $('btnNext').focus({preventScroll:true});
}

function next(){
  clearTimeout(timer);
  idx++;
  if (idx >= qs.length) finish(); else render();
}

function finish(){
  $('fill').style.width = '100%';
  const frac = roundLen ? score / roundLen : 0;
  const pct = Math.round(frac * 100);
  S.stats.rounds++;

  // רישום התוצאה בתחנה, ופתיחת הבאה אם עברה את הרף
  let unlocked = null, nextSt = null;
  if (round && round.stationId) {
    const rec = S.stations[round.stationId] || { best: 0, plays: 0 };
    const wasDone = rec.best >= 0.75;
    rec.plays++;
    rec.best = Math.max(rec.best, frac);
    rec.last = score + '/' + roundLen;
    S.stations[round.stationId] = rec;
    nextSt = STATIONS.find(s => s.id === round.stationId + 1) || null;
    if (!wasDone && rec.best >= 0.75 && nextSt && !nextSt.soon) unlocked = nextSt;
  }
  saveState();

  $('endNum').textContent = score + '/' + roundLen;
  $('endPct').textContent = pct + '% · רצף הכי ארוך: ' + best;
  $('endMsg').innerHTML =
    pct === 100 ? 'מושלם! 🇬🇷' :
    pct >= 75  ? 'יפה מאוד — התחנה הושלמה.' :
    pct >= 50  ? 'התקדמות טובה. עוד סיבוב וזה יישב.' :
                 'זו רק ההתחלה — כדאי להציץ בטבלה ולנסות שוב.';

  $('endUnlock').classList.toggle('hide', !unlocked);
  if (unlocked) $('endUnlock').innerHTML = `🔓 נפתחה תחנה חדשה — <b>${unlocked.name}</b>`;

  const has = misses.length > 0;
  $('review').classList.toggle('hide', !has);
  if (has) $('reviewRows').innerHTML = misses.map(m =>
    `<div class="row"><span class="k">${m.tag}</span><span class="v"><b>${m.note}</b></span></div>`).join('');
  $('btnSaveMisses').classList.toggle('hide', !has);
  $('btnSaveMisses').textContent = `⭐ לשמור את ${misses.length} אלה למילים שלי`;
  $('btnSaveMisses').disabled = false;

  const goNext = nextSt && !nextSt.soon && stStatus(nextSt) !== 'locked';
  $('btnNextStation').classList.toggle('hide', !goNext);
  if (goNext) $('btnNextStation').textContent = 'לתחנה הבאה — ' + nextSt.name;
  $('btnNextStation').onclick = () => goNext && startStation(nextSt);

  show('screenEnd');
}

/* ---------- שני הפרופילים במסך הראשי ---------- */
const CONTENT_STATIONS = () => STATIONS.filter(s => !s.soon);

function profileSummary(p){
  const st = p.id === profile.id ? S : peekState(p.id);
  const list = CONTENT_STATIONS();
  const done = list.filter(s => st.stations[s.id] && st.stations[s.id].best >= 0.75).length;
  const next = list.find(s => !(st.stations[s.id] && st.stations[s.id].best >= 0.75));
  const played = done > 0 || st.stats.correct > 0 || st.vocab.length > 0;
  return { p, done, total: list.length, next, correct: st.stats.correct, vocab: st.vocab.length, played };
}

function renderPicker(){
  for (const p of PROFILES) {
    const el = $(p.id === 'roni' ? 'pickRoni' : 'pickNir');
    if (el) el.innerHTML = avatar(p, 'big') + `<b>${p.name}</b>`;
  }
}

function renderDuo(){
  const data = PROFILES.map(profileSummary);
  const both = data.filter(d => d.played);
  // "מוביל" רק כשלשניהם יש נתונים ויש הפרש אמיתי
  const lead = both.length === 2 && data[0].correct !== data[1].correct
    ? (data[0].correct > data[1].correct ? data[0].p.id : data[1].p.id) : null;

  $('duoStrip').innerHTML = data.map(d => `
    <button class="duocol${d.p.id === profile.id ? ' me' : ''}${d.played ? '' : ' idle'}" data-switch="${d.p.id}">
      <div class="duoname">${avatar(d.p, 'sm')} ${d.p.name}${lead === d.p.id ? ' 👑' : ''}</div>
      <div class="duostage">${d.played
        ? (d.next ? 'תחנה ' + d.next.id + ' · ' + d.next.name : 'סיים את כל התחנות 🎉')
        : 'עוד לא שיחק כאן'}</div>
      <div class="duobar"><i style="width:${Math.round(d.done / d.total * 100)}%"></i></div>
      <div class="duometa">${d.played
        ? `${d.done}/${d.total} תחנות · ${d.correct} נכונות`
        : 'אין נתונים במכשיר הזה'}</div>
    </button>`).join('');
}

/* ---------- מסך המסלול ---------- */
let chapterView = 1;

function renderPath(){
  renderDuo();
  const ch = CHAPTERS[chapterView - 1];
  const list = STATIONS.filter(s => s.ch === ch.n);
  const done = list.filter(s => stDone(s.id)).length;

  $('chapTitle').textContent = `פרק ${ch.n} מתוך ${CHAPTERS.length} — ${ch.name}`;
  $('chapCount').textContent = `${done} מתוך ${list.length} תחנות הושלמו`;
  $('chapFill').style.width = (done / list.length * 100) + '%';
  $('prevChap').classList.toggle('off', chapterView === 1);
  $('nextChap').classList.toggle('off', chapterView === CHAPTERS.length);

  $('stationList').innerHTML = list.map(st => {
    const s = stStatus(st);
    const mark = s === 'done' ? '✓' : s === 'open' ? '●' : '🔒';
    const meta = s === 'done' ? `<span class="stmeta">${Math.round(stBest(st.id) * 100)}%</span>`
               : s === 'soon' ? `<span class="stmeta">בקרוב</span>` : '';
    // כמה מילים מהשיחות שלכם נכנסו לתחנה הזאת
    const base = { WORDS, WORDS2, PHRASES, REPLIES }[st.pool];
    const extra = base ? poolFor(st).length - base.length : 0;
    const sub = st.sub + (extra ? ` · +${extra} מהשיחות שלכם` : '');
    return `<button class="mode station ${s}" data-st="${st.id}">
        <span class="stmark ${s}">${mark}</span>
        <span class="stbody"><b>${st.id}. ${st.name}</b><small>${sub}</small></span>
        ${meta}</button>`;
  }).join('');

  $('vocabCount').textContent = S.vocab.length;
  $('profileChip').innerHTML = avatar(profile, 'xs') + ' ' + profile.name;
  $('barAvatar').innerHTML = avatar(profile, 'xs');
}

/* ---------- המילים שלי ---------- */
function renderVocab(){
  const n = S.vocab.length;
  $('vocabTitle').textContent = n ? `${n} מילים וביטויים שאספת` : 'עוד לא שמרת מילים';
  $('vocabEmpty').classList.toggle('hide', n > 0);
  $('btnPractice').classList.toggle('hide', n === 0);
  $('vocabList').innerHTML = S.vocab.map(v => `
    <div class="vrow">
      <button class="vsay" data-say="${esc(v.gk)}" title="להשמיע">🔊</button>
      <span class="vtext">
        <b class="gk">${esc(v.gk)}</b>
        <i>${esc(v.pron)}</i>
        <s data-edit="${esc(v.gk)}" title="לחצי לתיקון התרגום">${esc(v.he)}${v.src === 'talk' ? ' · 🎙️' : ''} ✎</s>
      </span>
      <button class="vdel" data-del="${esc(v.gk)}" title="למחוק">✕</button>
    </div>`).join('');
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function practiceVocab(){
  let pool = S.vocab.map(v => ({gk:v.gk, he:v.he, pron:v.pron}));
  // צריך 4 אפשרויות לכל שאלה — משלימים ממילים של תחנה 4 אם אין מספיק
  if (pool.length < 4) {
    const fill = WORDS2.filter(w => !pool.some(v => v.gk === w.gk)).slice(0, 4 - pool.length);
    pool = pool.concat(fill.map(w => ({gk:w.gk, he:w.he, pron:w.pron})));
  }
  startRound({ kinds:['wordMean','meanWord','wordPron'], pool, label:'המילים שלי' });
}

}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canHear = !!SR;
let talkTab = 'hear', talkItems = [], recog = null, listening = false;

const norm = s => String(s || '').toLowerCase().replace(/[.,!;·?"']/g, '').replace(/ς/g, 'σ').trim();

function localPairs(){
  const out = [];
  [...WORDS, ...WORDS2, ...PHRASES].forEach(x => out.push({gk:x.gk, he:x.he, pron:x.pron}));
  REPLIES.forEach(r => out.push({gk:r.gk, he:r.he, pron:r.pron}));
  S.vocab.forEach(v => out.push({gk:v.gk, he:v.he, pron:v.pron}));
  return out;
}

/* קודם המאגר שלנו (מיידי ומדויק), ואם אין — שירות תרגום ציבורי חינמי */
async function translateText(text, dir){
  const t = norm(text), pairs = localPairs();
  if (dir === 'el2he') {
    const hit = pairs.find(p => norm(p.gk) === t);
    if (hit) return { text: hit.he, pron: hit.pron, src: 'bank' };
  } else {
    const hit = pairs.find(p => norm(p.he) === t);
    if (hit) return { text: hit.gk, pron: hit.pron, src: 'bank' };
  }
  try {
    const pair = dir === 'el2he' ? 'el|he' : 'he|el';
    const r = await fetch('https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(text) + '&langpair=' + pair);
    if (!r.ok) throw 0;
    const j = await r.json();
    const out = j && j.responseData && j.responseData.translatedText;
    if (!out || /MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(out)) throw 0;
    return { text: out, src: 'web' };
  } catch (e) {
    return null;                     // לא ממציאים תרגום
  }
}

function talkStatus(msg, cls){
  $('talkStatus').textContent = msg || '';
  $('talkStatus').className = 'talkstatus' + (cls ? ' ' + cls : '');
}

let pendingText = '', handledText = '';

/* הכפתור מופיע רק כשיש טקסט שנקלט ועדיין לא תורגם — כדי שלא יישאר מסך תקוע */
function updatePending(){
  const waiting = !!pendingText && pendingText !== handledText && !listening;
  $('btnTranslateNow').classList.toggle('hide', !waiting);
  $('micBtn').textContent = listening ? '⏹' : '🎙️';
}

function finalizeHeard(){
  const t = (pendingText || '').trim();
  if (!t || t === handledText) return;
  handledText = t;
  updatePending();
  handleHeard(t);
}

function startListen(){
  if (listening) { try { recog.stop(); } catch(e){} return; }   // לחיצה שנייה עוצרת
  if (!canHear) { talkStatus('הדפדפן הזה לא תומך בזיהוי קולי — אפשר להקליד למטה', 'warn'); return; }
  const lang = talkTab === 'hear' ? 'el-GR' : 'he-IL';
  try {
    recog = new SR();
    recog.lang = lang; recog.interimResults = true; recog.maxAlternatives = 1; recog.continuous = false;
    recog.onstart = () => {
      listening = true; pendingText = ''; handledText = '';
      $('micBtn').classList.add('rec');
      talkStatus(talkTab === 'hear' ? 'מקשיב ליוונית… לחצי שוב כדי לעצור' : 'מקשיב לעברית… לחצי שוב כדי לעצור');
      updatePending();
    };
    recog.onresult = e => {
      let txt = '';
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      pendingText = txt.trim();
      $('micLive').textContent = pendingText;
      if (e.results[e.results.length - 1].isFinal) finalizeHeard();
    };
    recog.onerror = ev => {
      listening = false; $('micBtn').classList.remove('rec');
      talkStatus(ev.error === 'not-allowed' ? 'אין הרשאת מיקרופון — צריך לאשר בדפדפן'
               : ev.error === 'no-speech'   ? 'לא שמעתי כלום — אפשר לנסות שוב'
               : 'לא הצלחתי לשמוע. אפשר לנסות שוב או להקליד', 'warn');
      updatePending();
    };
    // סיום ההקלטה מתרגם לבד את מה שנקלט — ואם משהו נכשל, נשאר כפתור "תרגם עכשיו"
    recog.onend = () => {
      listening = false;
      $('micBtn').classList.remove('rec');
      if (pendingText && pendingText !== handledText) finalizeHeard();
      else updatePending();
    };
    recog.start();
  } catch (e) {
    talkStatus('לא הצלחתי להפעיל את המיקרופון — אפשר להקליד למטה', 'warn');
    updatePending();
  }
}

/* מילות קישור שאין טעם לשמור בנפרד */
const GREEK_STOP = new Set(['ο','η','το','τα','οι','του','της','των','τον','την','τους','τις','να','με',
  'σε','και','ειναι','είναι','στο','στη','στην','στον','στα','απο','από','για','δεν','θα','που','πως',
  'ενα','ένα','μια','ενας','ένας','μου','σου','μας','σας','αυτο','αυτό','αυτη','αυτή','αυτος','αυτός',
  'εγω','εγώ','εσυ','εσύ','ναι','οχι','όχι','πιο','τι','πού','που','μην','αλλα','αλλά']);

const knownGreek = w => { const t = norm(w); return localPairs().some(p => norm(p.gk) === t); };

/* שמירה מהשיחה: הביטוי עצמו, ובנוסף מילים חדשות מתוכו שעוד לא פגשנו */
async function saveFromTalk(item){
  let phrase = addVocab(item) ? 1 : 0, words = 0;
  const parts = String(item.gk || '').split(/[\s,.;!·?"'()]+/).filter(Boolean);
  if (parts.length > 1) {
    const cands = parts.filter(w => w.length >= 3 && !GREEK_STOP.has(norm(w)) && !knownGreek(w)).slice(0, 3);
    for (const w of cands) {
      const tr = await translateText(w, 'el2he');
      if (tr && tr.text && addVocab({ gk: w, he: tr.text, pron: translit(w), src: 'talk' })) words++;
    }
  }
  return { phrase, words };
}

async function handleHeard(text){
  if (!text) return;
  $('micLive').textContent = '';
  pendingText = ''; handledText = ''; updatePending();
  talkStatus('מתרגם…');
  const dir = talkTab === 'hear' ? 'el2he' : 'he2el';
  const res = await translateText(text, dir);
  const item = dir === 'el2he'
    ? { gk: text, pron: translit(text), he: res ? res.text : null }
    : { gk: res ? res.text : null, pron: res ? (res.pron || translit(res.text)) : null, he: text };
  item.at = Date.now();
  talkItems.unshift(item);
  talkStatus('');
  renderTalk();
}

function renderTalk(){
  $('talkTabHear').classList.toggle('on', talkTab === 'hear');
  $('talkTabSay').classList.toggle('on', talkTab === 'say');
  $('micLabel').textContent = talkTab === 'hear' ? 'לחצי והקשיבי למישהו מדבר יוונית' : 'לחצי ואמרי בעברית מה את רוצה להגיד';
  $('talkInput').placeholder = talkTab === 'hear' ? 'או להקליד מה שמעתי ביוונית…' : 'או להקליד בעברית…';
  $('micBtn').classList.toggle('off', !canHear);
  $('micHint').textContent = canHear ? '' : 'המיקרופון לא נתמך בדפדפן הזה — אפשר להקליד';

  $('talkResults').innerHTML = talkItems.map((it, i) => {
    const saved = it.gk && S.vocab.some(v => v.gk === it.gk);
    return `<div class="tcard">
      ${it.gk ? `<div class="tgk gk">${esc(it.gk)}</div>` : `<div class="tmiss">לא הצלחתי לתרגם את זה</div>`}
      ${it.pron ? `<div class="tpron">${esc(it.pron)}</div>` : ''}
      ${it.he ? `<div class="the">${esc(it.he)}</div>` : (it.gk ? `<div class="tmiss">אין תרגום — אבל ההגייה למעלה נכונה</div>` : '')}
      <div class="trow">
        ${it.gk && canSpeak ? `<button class="tbtn" data-say="${esc(it.gk)}">🔊 להשמיע</button>` : ''}
        ${it.gk && it.he ? `<button class="tbtn ${saved ? 'done' : ''}" data-save="${i}">${saved ? '✓ נשמר' : '⭐ לשמור'}</button>` : ''}
      </div>
    </div>`;
  }).join('');

  // הצעה לשמור אחרי שנצברו כמה ביטויים
  const cands = talkItems.filter(it => it.gk && it.he && !S.vocab.some(v => v.gk === it.gk));
  const show3 = cands.slice(0, 3);
  $('talkSuggest').classList.toggle('hide', show3.length < 2);
  if (show3.length >= 2) {
    $('suggestText').textContent = `מצאתי ${show3.length} ביטויים שיכולים להיות שימושיים לכם שוב. להוסיף למילים שלי?`;
    $('suggestList').innerHTML = show3.map(it =>
      `<label class="sug"><input type="checkbox" checked data-sug="${esc(it.gk)}"><span><b class="gk">${esc(it.gk)}</b> — ${esc(it.he)}</span></label>`).join('');
  }
}

/* ================= חיווט ================= */
function goPath(){
  clearTimeout(timer);
  renderPath();
  show('screenPath');
  if (syncUrl() && Date.now() - lastSync > 20000) syncPull().then(renderPath);
}

// פרופילים
$('screenProfile').addEventListener('click', e => {
  const b = e.target.closest('[data-profile]'); if (!b) return;
  setProfile(b.dataset.profile);
  goPath();
});

// החלפת פרופיל ישירות מהפס העליון
$('duoStrip').addEventListener('click', e => {
  const b = e.target.closest('[data-switch]'); if (!b) return;
  if (b.dataset.switch === profile.id) { renderStats(); show('screenStats'); $('modeLabel').textContent = '· השוואה'; return; }
  setProfile(b.dataset.switch);
  chapterView = 1;
  renderPath();
  toast('עברנו ל' + profile.name);
});

// פרקים
$('prevChap').onclick = () => { if (chapterView > 1) { chapterView--; renderPath(); } };
$('nextChap').onclick = () => { if (chapterView < CHAPTERS.length) { chapterView++; renderPath(); } };

// תחנות
$('stationList').addEventListener('click', e => {
  const b = e.target.closest('[data-st]'); if (!b) return;
  const st = STATIONS.find(s => s.id === +b.dataset.st);
  const s = stStatus(st);
  if (s === 'soon') { toast('התחנה הזאת עוד בבנייה — ' + st.sub); return; }
  if (s === 'locked') {
    const prev = STATIONS.find(x => x.id === st.id - 1);
    toast('קודם צריך לסיים את "' + prev.name + '" עם 75% ומעלה');
    return;
  }
  startStation(st);
});

// כלים
$('cardTalk').onclick = () => { talkItems = []; renderTalk(); show('screenTalk'); $('modeLabel').textContent = '· מצב שיחה'; };
$('cardVocab').onclick = () => { renderVocab(); show('screenVocab'); $('modeLabel').textContent = '· המילים שלי'; };
$('cardStudy').onclick = () => { buildStudy(); show('screenStudy'); $('modeLabel').textContent = '· ללמוד'; };
$('btnStats').onclick = () => { renderStats(); show('screenStats'); $('modeLabel').textContent = '· השוואה'; };
$('profileChip').onclick = () => { renderPicker(); show('screenProfile'); };

// מצב שיחה
$('talkTabHear').onclick = () => { talkTab = 'hear'; renderTalk(); };
$('talkTabSay').onclick  = () => { talkTab = 'say';  renderTalk(); };
$('micBtn').onclick = startListen;
$('talkSend').onclick = () => { const v = $('talkInput').value.trim(); if (v) { $('talkInput').value = ''; handleHeard(v); } };
$('talkInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('talkSend').click(); });
$('btnTranslateNow').onclick = finalizeHeard;

$('talkResults').addEventListener('click', async e => {
  const say = e.target.closest('[data-say]');
  if (say) { speak(say.dataset.say, translit(say.dataset.say)); return; }
  const sv = e.target.closest('[data-save]');
  if (!sv) return;
  const it = talkItems[+sv.dataset.save];
  sv.disabled = true; sv.textContent = 'שומר…';
  const r = await saveFromTalk(it);
  toast(r.words ? `נשמר · ${r.words} מילים חדשות נכנסו גם לתרגול`
      : r.phrase ? 'נשמר למילים שלי' : 'כבר שמור');
  renderTalk();
});

$('suggestYes').onclick = async () => {
  const boxes = [...$('suggestList').querySelectorAll('input[data-sug]:checked')];
  $('suggestYes').disabled = true; $('suggestYes').textContent = 'שומר…';
  let n = 0, w = 0;
  for (const cb of boxes) {
    const it = talkItems.find(x => x.gk === cb.dataset.sug);
    if (!it) continue;
    const r = await saveFromTalk(it);
    n += r.phrase; w += r.words;
  }
  $('suggestYes').disabled = false; $('suggestYes').textContent = 'להוסיף';
  toast(n + w ? `נוספו ${n + w} למילים שלי` : 'כבר היו שמורים');
  renderTalk();
};
$('suggestNo').onclick = () => { $('talkSuggest').classList.add('hide'); };

// המילים שלי
$('vocabList').addEventListener('click', e => {
  const s = e.target.closest('[data-say]');
  if (s) { speak(s.dataset.say, translit(s.dataset.say)); return; }
  const d = e.target.closest('[data-del]');
  if (d) { removeVocab(d.dataset.del); renderVocab(); return; }
  // תיקון התרגום במקום — מה שמתוקן כאן הוא מה שיופיע בתרגול
  const ed = e.target.closest('[data-edit]');
  if (!ed || ed.querySelector('input')) return;
  const item = S.vocab.find(v => v.gk === ed.dataset.edit);
  if (!item) return;
  ed.innerHTML = `<input class="vedit" type="text" value="${esc(item.he)}">`;
  const inp = ed.querySelector('input');
  inp.focus(); inp.select();
  const save = () => {
    const val = inp.value.trim();
    if (val && val !== item.he) { item.he = val; saveState(); toast('התרגום עודכן'); }
    renderVocab();
  };
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); save(); }
    if (ev.key === 'Escape') renderVocab();
  });
  inp.addEventListener('blur', save);
});
$('btnPractice').onclick = practiceVocab;
$('syncSave').onclick = async () => {
  const v = $('syncInput').value.trim().replace(/\/+$/, '');
  if (v && !/^https?:\/\//.test(v)) { toast('הכתובת צריכה להתחיל ב-https://'); return; }
  try { localStorage.setItem(SYNC_KEY, v); } catch(e){}
  if (!v) { setSyncStatus('off'); toast('הסנכרון נותק'); return; }
  setSyncStatus('...'); renderSyncBox();
  await syncPull();
  await pushState();
  renderStats();
  toast(syncState === 'ok' ? 'מחובר · הנתונים סונכרנו' : 'לא הצלחתי להתחבר');
};

$('btnShareStats').onclick = async () => {
  const txt = statsSummary();
  try {
    if (navigator.share) { await navigator.share({ text: txt }); return; }
    await navigator.clipboard.writeText(txt);
    toast('הסיכום הועתק — אפשר להדביק לניר');
  } catch (e) { toast('לא הצלחתי להעתיק'); }
};

// מסך סיום
$('btnNext').onclick = next;
$('btnStudyDone').onclick = goPath;
$('btnAgain').onclick = () => round && startRound(round);
$('btnMenu').onclick = goPath;
$('btnQuit').onclick = goPath;
document.querySelectorAll('[data-back]').forEach(b => b.onclick = goPath);
$('btnSaveMisses').onclick = () => {
  let n = 0;
  misses.forEach(m => {
    const all = [...WORDS, ...WORDS2, ...PHRASES];
    const hit = all.find(x => x.gk === m.tag) || REPLIES.find(r => r.gk === m.tag);
    if (hit && addVocab({gk:hit.gk, he:hit.he, pron:hit.pron})) n++;
  });
  $('btnSaveMisses').textContent = n ? `✓ ${n} נוספו למילים שלי` : 'כבר שמורים';
  $('btnSaveMisses').disabled = true;
};

document.addEventListener('keydown', e => {
  if ($('screenQuiz').classList.contains('hide')) return;
  if (e.key >= '1' && e.key <= '4') { const b = $('opts').children[+e.key - 1]; if (b && !b.disabled) b.click(); }
  if (e.key === 'Enter' || e.key === ' ') { if (locked) { e.preventDefault(); next(); } }
});

/* הודעה קצרה שנעלמת */
let toastT = null;
function toast(msg){
  $('toast').textContent = msg;
  $('toast').classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => $('toast').classList.remove('on'), 2600);
}

/* בהיר כברירת מחדל — כהה רק אם ביקשו */
const root = document.documentElement;
function setTheme(t){
  if (t === 'dark') root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
  $('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('greek-theme', t); } catch(e){}
}
let savedTheme = 'light';
try { savedTheme = localStorage.getItem('greek-theme') || 'light'; } catch(e){}
setTheme(savedTheme);
$('btnTheme').onclick = () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

/* עלייה: מי שכבר בחר פרופיל נכנס ישר למסלול */
let lastProfile = null;
try { lastProfile = localStorage.getItem('greek:v2:last'); } catch(e){}
if (lastProfile && PROFILES.some(p => p.id === lastProfile)) {
  setProfile(lastProfile);
  goPath();
  if (syncUrl()) syncPull().then(renderPath);
}
else { renderPicker(); show('screenProfile'); }
</script>
