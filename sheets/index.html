<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>דפי העבודה ביוונית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;800&family=Commissioner:wght@400;600;800&display=swap">
<style>
/* Layout: עמודה אחת; פס ציון דביק למעלה, דף העבודה כקלף לבן, מתחתיו התשובות. בהיר בלבד. */
:root{--bg:#EEF3F8;--pale:#E1E9F1;--card:#fff;--navy:#27415E;--deep:#1F3550;--blue:#4F7DB0;--turq:#7FE3D8;--mint:#E2F6F4;--ink2:#3D5877;--ink3:#58708C;--line:#D5DEE8;
--good:#1B7F5C;--goodbg:#E1F5EC;--bad:#B5462F;--badbg:#FBEFE9;--he:'Assistant',system-ui,sans-serif;--gr:'Commissioner','Helvetica Neue',Arial,sans-serif;--sh:0 14px 34px rgba(39,65,94,.08)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--he);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.gr{direction:ltr;text-align:left;unicode-bidi:isolate;font-family:var(--gr)}
p,h1,h2{margin:0}b{font-weight:800}
button{font:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.logo{display:inline-flex;color:var(--navy);--li:#4F7DB0}.logo-svg{height:24px;width:auto;aspect-ratio:247/77;display:block}
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:30px;padding:40px 34px 34px;color:#fff;background:radial-gradient(120% 90% at 15% 10%,#4F7DB0 0%,#27415E 62%);box-shadow:0 22px 50px rgba(39,65,94,.22);display:flex;flex-direction:column;gap:16px}
.hring{position:absolute;z-index:-1;width:220px;aspect-ratio:1;left:-60px;top:-70px;opacity:.35;pointer-events:none}.hring svg{width:100%;height:100%;overflow:visible}
.hero h1{font-size:clamp(2rem,6vw,3rem);font-weight:300;line-height:1.1;letter-spacing:-.01em}.hero h1 b{color:var(--turq)}
.hero p{color:var(--pale);max-width:520px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:99px;padding:13px 28px;font-weight:800;background:var(--navy);color:#fff}
.btn:hover{background:var(--deep)}
.hero .btn,.final .btn{background:var(--turq);color:var(--deep)}.hero .btn:hover,.final .btn:hover{background:#9BEBE2}
.hero .ghost,.final .ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}.hero .ghost:hover,.final .ghost:hover{background:rgba(255,255,255,.1)}
.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}.ghost:hover{background:#fff}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:24px;padding:22px 24px;box-shadow:var(--sh);min-width:0}
.sc{display:flex;flex-direction:column}.sc strong{font-size:2rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}.sc span{color:var(--ink3);font-size:.95rem}
h2{font-size:1.25rem;font-weight:800;line-height:1.3}
.hist{display:grid;gap:6px;margin-top:10px}.hist div{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-variant-numeric:tabular-nums}.hist i{height:10px;border-radius:9px;background:linear-gradient(270deg,var(--blue),var(--turq));display:block}.hist u{text-decoration:none;background:var(--pale);border-radius:9px;display:block}
/* פס עליון */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;border-radius:20px;box-shadow:0 10px 26px rgba(39,65,94,.12);padding:10px 16px;display:grid;gap:7px;margin-top:4px}
.top .l{display:flex;align-items:center;gap:12px;justify-content:space-between;font-variant-numeric:tabular-nums}
.pts{font-weight:800;font-size:1.2rem}.pts small{font-weight:400;font-size:.88rem;color:var(--ink3)}
.x{border:0;background:none;color:var(--ink3);padding:6px 4px;font-size:.92rem}
.bar{height:8px;border-radius:9px;background:var(--pale);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(270deg,var(--blue),var(--turq));transition:width .3s}
.vs{font-size:.88rem;font-weight:800;border-radius:99px;padding:2px 12px;background:var(--pale);color:var(--ink2);white-space:nowrap}.vs.up{background:var(--goodbg);color:var(--good)}.vs.down{background:var(--badbg);color:var(--bad)}
/* דף */
.sheet{display:flex;flex-direction:column;gap:14px}
.st{font-size:.92rem;color:var(--ink3)}
.task .gr{font-size:1.25rem;font-weight:600;line-height:1.35;color:var(--deep)}.task p{color:var(--ink3);font-size:.95rem}
.e0{color:var(--ink3);font-size:1rem}.e0 b{color:var(--ink2)}.circ{border:2px solid var(--blue);border-radius:99px;padding:0 7px}
.q{font-size:clamp(1.25rem,4.6vw,1.55rem);line-height:1.5;font-weight:600;color:var(--deep);border-top:1px solid var(--line);padding-top:14px}
.txt{background:var(--bg);border-radius:16px;padding:14px 16px;line-height:1.75}
.bl{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--blue);line-height:1.05;margin:0 2px}
.bl.s{min-width:34px}.bl.cur{background:var(--mint);border-color:#2FA89B;border-radius:4px 4px 0 0}.bl.f{min-width:0;color:var(--good);font-weight:800;border-color:var(--good)}
.tw{overflow-x:auto}table{border-collapse:collapse;direction:ltr;text-align:left;font-family:var(--gr);width:100%;font-size:.98rem}th{font-weight:400;color:var(--ink3);background:var(--bg)}td,th{border:1px solid var(--line);padding:7px 10px;vertical-align:top}
td.cur{background:var(--mint);box-shadow:inset 0 0 0 2px #2FA89B}td.f{color:var(--good);font-weight:800}tr.now td{font-weight:600;color:var(--deep)}tr.now td.f{font-weight:800;color:var(--good)}
.conj td:first-child,.conj th:first-child{color:var(--ink3)}
details{font-size:.95rem}summary{cursor:pointer;color:var(--blue);font-weight:800;width:fit-content}details .in{display:grid;gap:10px;margin-top:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.one{grid-template-columns:1fr}.opts.tri{grid-template-columns:repeat(3,1fr)}
.o{background:#fff;border:2px solid var(--line);border-radius:18px;padding:13px 16px;font-family:var(--gr);font-size:1.12rem;color:var(--deep);direction:ltr;text-align:left;display:flex;gap:12px;align-items:center;line-height:1.35;min-width:0;min-height:56px;overflow-wrap:anywhere}
.o kbd{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--ink3);display:grid;place-items:center;font:800 .82rem var(--he)}
.o:hover:not(:disabled){border-color:var(--blue)}.o:disabled{cursor:default;color:var(--ink3)}
.o.ok{border-color:var(--good);background:var(--goodbg);color:var(--good);font-weight:600}.o.ok kbd{background:var(--good);color:#fff}
.o.no{border-color:var(--bad);background:var(--badbg);color:var(--bad)}.o.no kbd{background:var(--bad);color:#fff}
.o.used:not(.ok):not(.no){opacity:.5;text-decoration:line-through}
#fb{scroll-margin-bottom:16px}.fb{border-radius:24px;padding:18px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb.g{background:var(--goodbg);color:var(--good)}.fb.b{background:var(--badbg);color:var(--bad)}.fb>div{flex:1 1 260px;min-width:0}.fb h2{font-size:1.2rem}.fb .ans{font-size:1.15rem;font-weight:800;color:var(--good);text-align:right}.fb small{color:var(--ink2);font-size:.92rem}
.final{background:radial-gradient(120% 120% at 85% 0%,#3A5E87 0%,var(--navy) 62%);color:#fff;border-radius:30px;padding:40px 28px;text-align:center;display:grid;gap:12px;justify-items:center}.final .big{font-size:4.2rem;font-weight:800;line-height:1;color:var(--turq);font-variant-numeric:tabular-nums}.final p{color:var(--pale)}.final .row{justify-content:center;margin-top:8px}
.ex{display:grid;gap:8px;margin-top:10px}.ex div{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid var(--line);padding-top:8px;font-variant-numeric:tabular-nums}
.miss{display:grid;gap:10px;margin-top:10px}.miss>div{border-top:1px solid var(--line);padding-top:10px}.miss .a{color:var(--good);font-weight:800}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px}.pl{border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:18px;padding:12px 16px;text-align:right;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}.pl b{font-size:1.25rem;line-height:1.3}.pl span{color:var(--pale);font-size:.9rem;line-height:1.45}.pl[aria-pressed="true"]{border-color:var(--turq);background:rgba(127,227,216,.16)}.pl[aria-pressed="true"] b{color:var(--turq)}
.sk{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sk .btn{padding:9px 18px;font-size:.95rem;font-weight:400}.auto{display:flex;gap:8px;align-items:center;color:var(--pale);font-size:.98rem;cursor:pointer}.auto input{width:20px;height:20px;accent-color:#7FE3D8;flex:none}
@media(max-width:560px){.hero{padding:30px 22px 26px}.card{padding:18px}.opts:not(.tri){grid-template-columns:1fr}.opts.tri .o{padding:12px 10px;gap:8px;justify-content:center}.opts.tri kbd{display:none}.hring{width:150px}.conj td,.conj th{padding:6px;font-size:.9rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const N=QS.length,PT=10,KEY="greek-sheets-v2",app=document.getElementById("app");

/* מיזוג: כל הסיבובים משני המכשירים, והמצב האמצעי מהמכשיר שעודכן אחרון */
function merge(a,b){const m=new Map();for(const r of [...a.runs,...b.runs])m.set(r.at,r);const n=b.t>a.t?b:a;return{cur:n.cur,auto:n.auto,t:n.t,runs:[...m.values()].sort((x,y)=>x.at-y.at).slice(-30)}}

function local(){try{localStorage.setItem(KEY,JSON.stringify({...ALL,who}))}catch(e){}}
async function push(k,ka){clearTimeout(timer);timer=null;const sent=ALL[k].t;try{const q=await fetch(SYNC+k,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(ALL[k]),keepalive:!!ka});if(!q.ok)throw 0;const d=valid((await q.json()).state);if(d){const own=ALL[k].t>sent;ALL[k]=own?{...ALL[k],runs:merge(ALL[k],d).runs}:merge(ALL[k],d);if(k===who)S=ALL[k];local()}setSync(true)}catch(e){setSync(false)}}

async function pull(){const late=[];try{for(const k in NAMES){const q=await fetch(SYNC+k+"?t="+Date.now(),{cache:"no-store"});if(!q.ok)throw 0;const d=valid(await q.json());if(d){if(k===who&&view==="q")ALL[k]={...ALL[k],runs:merge(ALL[k],d).runs};else ALL[k]=merge(ALL[k],d)}if(ALL[k].t&&(!d||ALL[k].t>d.t||ALL[k].runs.length>d.runs.length))late.push(k)}S=ALL[who];local();setSync(true);for(const k of late)if(!(timer&&k===who))push(k)}catch(e){setSync(false)}if(view==="home"&&!document.getElementById("y"))home(true)}

  if(k==="conj"){const at=new Map(e.items.map((it,i)=>[it[0].join(),i]));return `<div class="tw"><table class="conj"><tr><th>Πρόσωπο${VERBS.map(v=>`<th>${v}ω`).join("")}</tr>${PERS.map((p,r)=>`<tr><td>${p}${VERBS.map((v,c)=>{const i=at.get(r+","+c);if(i===undefined)return `<td>${v+END[r]}`;const f=i<Q.i||(i===Q.i&&done);return `<td class="${f?"f":i===Q.i?"cur":""}">${f?v+END[r]:""}`}).join("")}`).join("")}</table></div>`}
  if(k==="cloze"){let j=0;return `<p class="gr">${esc(e.bank)}</p><p class="gr txt">${esc(e.text).replace(/____/g,()=>{const i=j++;return i<Q.i||(i===Q.i&&done)?`<span class="bl f">${right(i)}</span>`:`<span class="bl${i===Q.i?" cur":""}"></span>`})}</p>`}
  const num=`${Q.i+1}. `;
  let h=e.text?`<p class="gr txt">${esc(e.text)}</p>`:"";
  if(e.e0)h+=`<p class="gr e0">0. ${e.e0}</p>`;
  const main=e.sh===2&&e.n===3&&done?circled(Q.q,Q.a):Q.q.includes("____")?blanks(Q.q,done?parts(Q):null):esc(Q.q)+(e.arrow?" → "+(done?`<span class="bl f">${esc(Q.a)}</span>`:`<span class="bl"></span>`):"");
  return h+`<p class="gr q">${num}${main}</p>`;
}
const answered=()=>S.cur.length;
function topbar(i){
  const p=prev();let vs="";
  const cm=p?common(S.cur,p.bits):null;if(cm&&cm.n){const d=cm.x-cm.y;vs=`<span class="vs ${d>0?"up":d<0?"down":""}">${d>0?`${d} נק׳ מעל הפעם הקודמת`:d<0?`${-d} נק׳ מתחת לפעם הקודמת`:"תיקו עם הפעם הקודמת"}</span>`}
  return `<div class="top"><div class="l"><span class="pts">${pts(S.cur)} <small>נקודות, ${NAMES[who]}</small></span>${vs}<button class="x" id="home">יציאה</button></div><div class="bar"><i style="width:${i/N*100}%"></i></div></div>`;
}
let picked=null,back=[];
const autoSet=()=>{const p=prev();return S.auto&&p&&done_(p.bits)?p.bits:null};
function fillAuto(){const a=autoSet();let c=false;if(a)while(S.cur.length<N&&a[S.cur.length]==="2"){S.cur+="2";c=true}if(c)save()}
function skip(n){back.push(S.cur.length);S.cur+="2".repeat(n);save();ask()}

function ask(){
  view="q";picked=null;fillAuto();const i=answered();if(i>=N)return end();
  const Q=QS[i],e=Q.e,sh=e.sh===1?SH1:SH2,opts=Q.fix?Q.o:shuf(Q.o);
  const long=Math.max(...opts.map(o=>o.length));
  const before=e.kind==="cloze"?e.items.slice(0,Q.i).map(x=>x[2].a):[];
  app.innerHTML=topbar(i)+`<section class="card sheet" id="sheet"><p class="st">דף ${e.sh} מתוך 2, <span class="gr">${sh.t}</span><br>שאלה ${i+1} מתוך ${N}</p>
  <div class="task"><p class="gr">${e.n}. ${e.t}</p><p>${e.he}</p></div>
  <div id="qb">${body(Q,false)}</div>
  <details id="help"><summary class="gr">Θυμάμαι</summary><div class="in gr">${sh.help.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,"</table></div>")}</div></details></section>
  <div class="opts ${opts.length===6?"tri":long>24?"one":""}" id="opts">${opts.map((o,k)=>`<button class="o${before.includes(o)?" used":""}" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o)}</span></button>`).join("")}</div><div class="sk" id="sk"><button class="btn ghost" id="skip">לדלג על השאלה</button>${e.items.length-Q.i>1?`<button class="btn ghost" id="skipx">לדלג על שאר התרגיל (${e.items.length-Q.i} שאלות)</button>`:""}${back.length?`<button class="x" id="undo">ביטול הדילוג האחרון</button>`:""}</div><div id="fb" aria-live="polite"></div>`;
  document.getElementById("skip").onclick=()=>skip(1);const sx=document.getElementById("skipx");if(sx)sx.onclick=()=>skip(e.items.length-Q.i);
  const un=document.getElementById("undo");if(un)un.onclick=()=>{S.cur=S.cur.slice(0,back.pop());save();view="q";ask()};
  app.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(Q,opts[b.dataset.k],b,opts));
  document.getElementById("home").onclick=home;
  window.scrollTo(0,0);
}
function pick(Q,o,b,opts){
  if(picked)return;picked=o;const ok=o===Q.a;S.cur+=ok?"1":"0";back=[];document.getElementById("sk").hidden=true;save();
  app.querySelectorAll(".o").forEach(x=>{x.disabled=true;const v=opts[x.dataset.k];if(v===Q.a){x.classList.add("ok")}else if(x===b)x.classList.add("no")});
  document.getElementById("qb").innerHTML=body(Q,true);
  const t=document.createElement("div");t.innerHTML=topbar(S.cur.length);app.replaceChild(t.firstChild,app.firstChild);document.getElementById("home").onclick=home;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"g":"b"}"><div><h2>${ok?`<span class="gr">Σωστά!</span> נכון, ${PT} נקודות`:"לא נכון. התשובה הנכונה:"}</h2>${ok?"":`<p class="gr ans">${esc(Q.a)}</p>`}${Q.note?`<small>${Q.note.replace(/«.*?»/g,m=>`<bdi dir="ltr">${m}</bdi>`)}</small>`:""}</div><button class="btn" id="next">${S.cur.length<N?"לשאלה הבאה":"לתוצאה"}</button></div>`;
  const n=document.getElementById("next");n.onclick=ask;n.focus({preventScroll:true});document.getElementById("fb").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function end(){
  back=[];const bits=S.cur;if(!done_(bits)){S.cur="";save();return home()}
  view="end";const p=prev(),b0=best(),had=S.runs.length>0,me=pts(bits),an=done_(bits),sk=skips(bits);
  S.runs=[...S.runs,{bits,at:Date.now()}].slice(-30);S.cur="";save(true);
  const cm=p?common(bits,p.bits):{x:0,y:0,n:0},same=!p||[...bits].every((c,i)=>(c==="2")===(p.bits[i]==="2")),d=cm.x-cm.y,rec=me>b0&&had?" וזה שיא חדש!":"";
  const msg=!had?"זה הציון הראשון. בפעם הבאה מתחרים מולו.":!cm.n?`אין שאלות שעניתם עליהן גם בפעם הקודמת, אז אין השוואה הפעם${rec}`:same?(d>0?`שיפור של ${d} נקודות מהפעם הקודמת (${cm.y})${rec}`:d<0?`${-d} נקודות פחות מהפעם הקודמת (${cm.y}). עוד סיבוב?`:`בדיוק כמו בפעם הקודמת (${me}).`):`ב-${cm.n} השאלות שעניתם עליהן בשתי הפעמים: ${cm.x} נקודות עכשיו, ${cm.y} בפעם הקודמת${rec}`;
  let c=0;const rows=EX.map(e=>{const s=bits.slice(c,c+e.items.length);c+=e.items.length;return `<div><span>דף ${e.sh}, תרגיל ${e.n}</span><b>${done_(s)?`${pts(s)/PT} מתוך ${done_(s)}`:"דילגתם"}${done_(s)&&skips(s)?` <small>(דילגתם על ${skips(s)})</small>`:""}</b></div>`}).join("");
  const miss=QS.filter((q,i)=>bits[i]==="0");
  app.innerHTML=`<section class="final"><p>הציון של ${NAMES[who]}</p><div class="big">${me}</div><p>מתוך ${an*PT}, ${me/PT} תשובות נכונות מתוך ${an}${sk?`. דילגתם על ${sk}`:""}</p><h2>${msg}</h2>${ALL[other()].runs.length?`<p>השיא של ${NAMES[other()]}: ${bestOf(ALL[other()])}</p>`:""}<div class="row"><button class="btn" id="again">לשחק שוב מהתחלה</button><button class="btn ghost" id="home">למסך הפתיחה</button></div>${autoBox()}</section>
  <section class="card"><h2>לפי תרגילים</h2><div class="ex">${rows}</div></section>
  ${miss.length?`<section class="card"><h2>הטעויות והתשובות הנכונות</h2><div class="miss">${miss.map(q=>`<div><p class="st">דף ${q.e.sh}, תרגיל ${q.e.n}, שאלה ${q.i+1}</p><p class="gr">${solved(q)}</p></div>`).join("")}</div></section>`:""}`;
  document.getElementById("again").onclick=start;wireAuto();document.getElementById("home").onclick=home;window.scrollTo(0,0);
}
function autoBox(){const p=prev(),k=p?skips(p.bits):0;return k?`<label class="auto"><input type="checkbox" id="auto"${S.auto?" checked":""}> בלי ${k===1?"השאלה שדילגתם עליה":`${k} השאלות שדילגתם עליהן`} בפעם הקודמת</label>`:""}
function wireAuto(){const a=document.getElementById("auto");if(a)a.onchange=()=>{S.auto=a.checked;save()}}
function start(){back=[];S.cur="";save();ask()}
function home(quiet){
  if(quiet!==true&&timer)push(who);
  view="home";const i=answered(),p=prev();
  app.innerHTML=`<div>${T("logo")}</div><section class="hero">${T("ring")}<h1>דפי העבודה <b>ביוונית</b></h1><p>${N} שאלות משני דפי העבודה, בדיוק לפי הסדר. ${PT} נקודות לכל תשובה נכונה, ואפשר לדלג על מה שלא רלוונטי.</p>
  <div class="who" role="group" aria-label="מי משחק?">${Object.keys(NAMES).map(k=>{const q=ALL[k],l=q.runs[q.runs.length-1];return `<button class="pl" data-w="${k}" aria-pressed="${k===who}"><b>${NAMES[k]}</b><span>${l?`שיא ${bestOf(q)}<br>פעם קודמת ${pts(l.bits)} מתוך ${done_(l.bits)*PT}`:q.cur?`באמצע, שאלה ${Math.min(q.cur.length+1,N)}`:"אין ציון עדיין"}</span></button>`}).join("")}</div>
  <div class="row">${i?`<button class="btn" id="go">${NAMES[who]}, להמשיך משאלה ${Math.min(i+1,N)}</button><button class="btn ghost" id="re">להתחיל מהתחלה</button>`:`<button class="btn" id="go">${NAMES[who]}, ${p?"לשחק שוב":"מתחילים"}</button>`}</div>${i?"":autoBox()}<div id="cf"></div></section>
  ${S.runs.length>1?`<section class="card"><h2>הסיבובים של ${NAMES[who]}</h2><div class="hist">${S.runs.slice(-8).reverse().map(r=>`<div><span>${date(r.at)}</span><u><i style="width:${pts(r.bits)/N/PT*100}%"></i></u><b>${pts(r.bits)}</b></div>`).join("")}</div></section>`:""}<p class="st" id="sync">${syncText()}</p>`;
  app.querySelectorAll(".pl").forEach(b=>b.onclick=()=>{if(timer)push(who);who=b.dataset.w;S=ALL[who];back=[];local();home(true)});
  document.getElementById("go").onclick=ask;wireAuto();
  const re=document.getElementById("re");if(re)re.onclick=()=>{document.getElementById("cf").innerHTML=`<p>למחוק את ${pts(S.cur)} הנקודות מהסיבוב הזה ולהתחיל משאלה 1?</p><div class="row" style="margin-top:10px"><button class="btn" id="y">כן, מהתחלה</button><button class="btn ghost" id="n">לא</button></div>`;document.getElementById("y").onclick=start;document.getElementById("n").onclick=home};
  if(quiet!==true)window.scrollTo(0,0);
}
document.addEventListener("keydown",ev=>{if(view!=="q"||ev.metaKey||ev.ctrlKey)return;if(/^[1-6]$/.test(ev.key)&&!picked){const b=app.querySelector(`.o[data-k="${ev.key-1}"]`);if(b){ev.preventDefault();b.click()}}});
home();pull();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){if(timer)push(who,true)}else if(view==="home")pull()});
</script>
</body></html>
